name: Cypress Architecture Rules

# ─────────────────────────────────────────────────────────────────────────────
# Runs the non-negotiable architecture validation hook on every PR that touches
# Cypress code, hooks, or framework config.
#
# This is the CI equivalent of the local Edit/Write hook. Both use the same
# scanner; CI covers changes made outside an AI tool and scans the full tree.
#
# Blocks merge if:
#   - cy.wait(number) is found
#   - hardcoded selectors are found in tests or commands
#   - hardcoded URLs are found in tests or commands
#   - new *.actions.js files are added
#   - new page-object wrapper files are added
# ─────────────────────────────────────────────────────────────────────────────

# BLOCKER: GitHub account billing lock — automatic Actions minutes are unavailable.
# Intended activation (restore when billing is fixed):
#   on:
#     pull_request:
#       paths:
#         - "cypress/**"
#         - ".claude/hooks/**"
#         - "harness.config.json"
#         - "harness/**"
#         - "package.json"
#         - "package-lock.json"
#     workflow_dispatch:
# Until then, only manual runs work. Do not re-enable pull_request while locked.
on:
  workflow_dispatch:

jobs:
  validate-architecture:
    name: Architecture Rules Validation
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Verify harness projections
        run: npm run harness:check && npm run harness:test

      - name: Validate non-negotiable rules
        run: npm run check:rules
